aid: genlogs
name: GenLogs
description: >-
  GenLogs is a truck intelligence platform that provides ground-truth data on every motor
  carrier in America from a nationwide network of proprietary roadside sensors, satellites,
  and millions of data sources - 4.2 billion commercial-vehicle images with 16 million added
  daily, covering 97% of active motor carriers. The GenLogs API (https://api.genlogs.io) turns
  that sensor network into freight intelligence: source and score carriers by lane, verify a
  carrier was recently sighted along an origin/destination, pull carrier and FMCSA profiles,
  run carrier-vetting rules, discover shippers by lane and shipper facilities with GeoJSON
  network maps, manage onboarded-carrier contacts, track mismatch observations, and receive
  HMAC-SHA512-signed alert webhooks. It serves brokers and shippers, insurance underwriting and
  claims, law enforcement asset recovery, and carriers. Auth uses an x-api-key plus a short-lived
  Access-Token, with named per-endpoint permissions.
