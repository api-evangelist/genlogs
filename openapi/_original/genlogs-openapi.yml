  /facilities:
    get:
      summary: Search facilities by name, address, zip code, city/state, website domain, or coordinates
      description: 'Unified facility search. Provide at least one of: non-empty **`name`**, non-empty
        **`address`**, **`zip_code`**, non-empty **`website_domain`**, or both **`city`** and **`state`**
        (then use **`radius`** around the geocoded point). You may also pass **`location`** as `latitude,longitude`
        for radius search instead of city/state.

        Optionally include lane data per facility with **`include_lanes=true`**. Lanes can be filtered
        by **`min_distance`** (miles from facility) and **`direction`** (compass direction). Filters are
        applied before the **`top_n`** limit.


        ## Pagination


        When results exceed 100 facilities, the response is paginated using opaque cursor-based pagination.
        The `Link` response header contains a next-page URL with a `cursor` parameter. Follow that URL
        to retrieve subsequent pages. The `X-Total-Count` header shows the total matching facilities across
        all pages. Pagination is not supported with `smart_search=true`.

        See component schema **FacilitiesQueryCriteria** for the full parameter model and validation shape.

        Historical path `/find_facilities` exposes the same search behavior and is documented here as
        **`/facilities`** for a single contract.

        '
      parameters:
      - name: accept
        in: header
        required: true
        schema:
          type: string
        description: application/json
      - name: Access-Token
        in: header
        required: true
        schema:
          type: string
        description: Access Token for authentication
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
        description: X api key for authentication
      - description: 'Facility or collection name (optional if `address`, both `city` and `state`, or
          `website_domain` are provided).

          See **FacilitiesQueryCriteria** for validation rules.

          '
        in: query
        name: name
        required: false
        schema:
          type: string
          maxLength: 500
      - description: 'Substring match on formatted address (optional if `name`, both `city` and `state`,
          or `website_domain` are provided).

          '
        in: query
        name: address
        required: false
        schema:
          type: string
          maxLength: 500
      - description: City; use with `state` for geocoded radius search unless `name`, `address`, or `website_domain`
          alone is sufficient.
        in: query
        name: city
        required: false
        schema:
          type: string
          maxLength: 150
      - description: State; use with `city` unless `name`, `address`, or `website_domain` supplies the
          search mode.
        in: query
        name: state
        required: false
        schema:
          type: string
          maxLength: 150
      - description: 'Substring match against the shipper''s `contact_url`. Must include the TLD

          (e.g. `acme.com`). Optional path tails (`acme.com/about`) are accepted by

          the validator but the path is stripped before matching — only the host

          is searched.


          **Mutually exclusive with `name` and `address`.** If `name` or `address`

          is also supplied, `website_domain` is silently ignored (see

          **FacilitiesQueryCriteria** → *Filter precedence*). Also ignored when

          `smart_search=true` is used together with `name`.

          '
        in: query
        name: website_domain
        required: false
        schema:
          type: string
          maxLength: 253
          minLength: 5
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*\.[A-Za-z]{2,}([/.].*)?$
      - description: Comma-separated `latitude,longitude`; radius applies around this point when provided
          instead of city/state.
        in: query
        name: location
        required: false
        schema:
          type: string
      - description: Search radius in miles around the geocoded city/state point or `location`
        in: query
        name: radius
        required: false
        schema:
          type: number
          maximum: 150
      - description: Lot size category filter
        in: query
        name: lot_size_category
        required: false
        schema:
          type: string
          maxLength: 50
      - description: Maximum number of facilities to return
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: Optional place category filter (pipe-separated values accepted by the service)
        in: query
        name: facility_type
        required: false
        schema:
          type: string
          maxLength: 500
      - description: Optional intermodal drayage filter flag
        in: query
        name: intermodal_drayage
        required: false
        schema:
          type: string
      - description: Include inbound and outbound lane data for each facility. Lanes are ranked by weight.
        in: query
        name: include_lanes
        required: false
        schema:
          type: boolean
      - description: Number of top lanes to return per direction (inbound/outbound) per facility.
        in: query
        name: top_n
        required: false
        schema:
          type: integer
          default: 10
      - description: Minimum distance in miles from the facility to a lane destination. Lanes closer than
          this distance are excluded. Applied before top_n.
        in: query
        name: min_distance
        required: false
        schema:
          type: number
      - description: Filter lanes by compass direction from the facility. Applied before top_n.
        in: query
        name: direction
        required: false
        schema:
          type: string
          enum:
          - N
          - S
          - E
          - W
          - NE
          - NW
          - SE
          - SW
      - description: US zip code; searches facilities near the zip centroid.
        in: query
        name: zip_code
        required: false
        schema:
          type: string
      - description: 'Opaque pagination cursor from the Link header of a previous response.

          When results exceed 100 facilities, the server returns a Link header

          containing a next-page URL with this cursor embedded. Follow that URL

          to retrieve subsequent pages. Do not construct or parse this value —

          it is server-controlled and opaque.

          '
        in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 500
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                description: Array of facility objects (see FacilitiesQueryCriteria for query rules).
                items:
                  $ref: '#/components/schemas/Facility'
          description: List of facilities
          headers:
            X-Total-Count:
              description: Total number of matching facilities across all pages.
              schema:
                type: integer
            Link:
              description: 'RFC 8288 Link header with rel="next" pointing to the next page URL.

                Absent on the final page. Example:

                `<https://api.genlogs.io/find_facilities?zip_code=91761&include_lanes=true&cursor=eyJ...>;
                rel="next"`

                '
              schema:
                type: string
        '400':
          description: Validation error (missing search criteria, invalid parameters, or invalid cursor)
      operationId: getShipperFacilities
