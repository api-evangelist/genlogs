        along the lane within the last 90 days. Requires the verifier-carrier permission.
      operationId: verifyCarrierSighting
      parameters:
      - name: Access-Token
        in: header
        required: true
        schema:
          type: string
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      - name: usdot
        in: query
        required: true
        schema:
          type: string
        description: USDOT of the detected carrier.
      - name: origin_city
        in: query
        required: true
        schema:
          type: string
      - name: origin_state
        in: query
        required: true
        schema:
          type: string
      - name: destination_city
        in: query
        required: false
        schema:
          type: string
      - name: destination_state
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A JSON object with verified true/false
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
        '400':
          description: Required parameters missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          description: Authentication credentials missing or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: Access to the requested resource is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
components:
