          title: Vin
        cab_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Cab Number
        trailer_logo:
          anyOf:
          - type: string
          - type: 'null'
          title: Trailer Logo
        trailer_number:
          anyOf:
          - type: string
          - type: 'null'
