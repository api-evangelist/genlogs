          type: array
          description: Top inbound lanes ranked by weight (only present when `include_lanes=true`).
          items:
            $ref: '#/components/schemas/FacilityLane'
        outbound_lanes:
          type: array
          description: Top outbound lanes ranked by weight (only present when `include_lanes=true`).
          items:
            $ref: '#/components/schemas/FacilityLane'
      required:
      - facility_name
      - formatted_address
      - id
      - lat
      - lon
      - place_category
      type: object
    FacilityLane:
      type: object
      properties:
        city:
          type: string
          description: Largest city in the H3 hexagon.
        state:
          type: string
          description: US state of the lane destination.
        weight:
          type: number
          description: Ranking signal from the network GeoJSON (higher = stronger lane).
        visit_share:
          type: string
          description: Bucketed visit share percentage (e.g. "15-20%").
        hexagon_id:
          type: string
          description: H3 hexagon index for the lane destination.
        distance_miles:
          type: number
          nullable: true
          description: Distance in miles from the facility to the lane destination (present when min_distance
            or direction is provided).
        direction:
          type: string
          nullable: true
          description: Compass direction of the lane from the facility (e.g. "NE", "SW"). Present when
            min_distance or direction filter is provided.
      required:
      - city
      - state
      - weight
      - visit_share
      - hexagon_id
    FacilityNetworkMap:
      type: object
      required:
      - type
      - features
      properties:
        type:
          type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/FacilityNetworkFeature'
    FacilityNetworkFeature:
      type: object
      required:
      - type
      - geometry
      - properties
      properties:
        type:
          type: string
        geometry:
          $ref: '#/components/schemas/GeoJSONGeometry'
        properties:
          type: object
          additionalProperties: true
          description: Arbitrary metadata associated with the feature.
    GeoJSONGeometry:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Point
          - LineString
          - Polygon
          - MultiPoint
          - MultiLineString
          - MultiPolygon
        coordinates:
          type: array
          items: {}
          description: GeoJSON coordinate array whose structure depends on geometry type.
    AuthError:
      type: object
      properties:
        message:
          type: string
        subcode:
          type: integer
          description: Optional subcode with additional error context.
    ExternalMismatchObservationsRequest:
      type: object
      additionalProperties: false
      properties:
        usdots:
          type: array
          items:
            type: string
          description: USDOT numbers (strings). Each non-empty entry creates one alert.
          default: []
        mcs:
          type: array
          items:
            type: string
          description: MC numbers (strings). Each non-empty entry creates one alert.
          default: []
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/MismatchObservationPairRequest'
          description: 'Paired MC/USDOT identifiers. Each item creates one combined alert row with both
            MC and USDOT in the stored criteria.

            '
          default: []
        logos:
          type: array
          nullable: true
          items:
            type: string
          description: 'Optional trailer logos list. Each value must be a non-empty string. Values are
            trimmed, deduplicated, and stored in lowercase format. Matching against the logos catalog.

            '
        alert_name:
          type: string
          nullable: true
          description: Optional display name; omitted or whitespace-only is stored as null.
    MismatchObservationPairRequest:
      type: object
      additionalProperties: false
      required:
      - mc
      - usdot
      properties:
        mc:
          type: string
          minLength: 1
          description: MC number for the combined alert row.
        usdot:
          type: string
          minLength: 1
          description: USDOT number for the combined alert row.
    MismatchObservationsListResponse:
      type: object
      required:
